services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: invoicing
    ports:
      - "55437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d invoicing"]
      interval: 2s
      timeout: 3s
      retries: 20

  # The API, built from ./Dockerfile. Same code as "dotnet run --project src".
  api:
    build: .
    environment:
      ConnectionStrings__Db: "Host=db;Port=5432;Database=invoicing;Username=demo;Password=demo"
      Urls: "http://+:8080"
    ports:
      - "5085:8080"
    depends_on:
      db:
        condition: service_healthy

  # The demo client, same image. Only starts on request: docker compose run --rm demo
  demo:
    build: .
    command: ["demo", "http://api:8080"]
    depends_on:
      - api
    profiles: ["demo"]
